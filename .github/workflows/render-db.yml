name: Base Render

# Base Postgres gratuite de Render (supprimée par Render après 30 jours) :
#  - chaque jour : sauvegarde chiffrée (artefact 30 jours) et renouvellement dès 25 jours ;
#  - chaque heure : renouvellement seulement, et seulement la nuit (0 h - 7 h à Dakar) tant que
#    la base a moins de 28 jours. GitHub retarde souvent les tâches planifiées de plusieurs heures
#    (exécutée vers 9-10 h au lieu de 2 h 30, audit du 11/11/2026) : le renouvellement, qui
#    redéploie l'API, tombait en pleine journée de travail.
#  - à la demande : status, backup, ensure (première création), rotate --force,
#    import depuis Railway (secret SOURCE_DATABASE_URL).
# Secrets : RENDER_API_KEY (obligatoire), SOURCE_DATABASE_URL (pour l'import seulement).
# Guide : docs/deploiement-render.md

on:
  schedule:
    - cron: "30 2 * * *"   # 02:30 UTC = 02:30 à Dakar : sauvegarde + renouvellement si dû
    - cron: "15 * * * *"   # chaque heure : renouvellement de nuit seulement (sans sauvegarde à part)
  workflow_dispatch:
    inputs:
      action:
        description: "Action"
        type: choice
        options: [rotate, backup, status, ensure, rotate-force, import-railway]
        default: rotate

concurrency:
  group: render-db
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  db:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      BACKUP_DIR: backups
    steps:
      - uses: actions/checkout@v7
      - name: "Secret RENDER_API_KEY absent"
        if: env.RENDER_API_KEY == ''
        run: |
          echo "::error::Ajouter le secret RENDER_API_KEY (Settings, Secrets and variables, Actions)."
          exit 1
      # pg_dump/pg_restore 18 (version de la base Railway d'origine) : image docker postgres:18,
      # utilisée par scripts/render_db.sh quand le client local est plus ancien.
      - name: Client PostgreSQL 18
        run: docker run --rm postgres:18 pg_dump --version
      - name: Base Render
        env:
          ACTION: ${{ inputs.action || (github.event.schedule == '15 * * * *' && 'rotate-night' || 'rotate') }}
          SOURCE_DATABASE_URL: ${{ secrets.SOURCE_DATABASE_URL }}
        run: |
          case "$ACTION" in
            rotate)         scripts/render_db.sh backup; scripts/render_db.sh rotate ;;
            rotate-night)   scripts/render_db.sh rotate ;;
            rotate-force)   scripts/render_db.sh rotate --force ;;
            import-railway) scripts/render_db.sh import "$SOURCE_DATABASE_URL" ;;
            *)              scripts/render_db.sh "$ACTION" ;;
          esac
          scripts/render_db.sh status
      # Le dépôt est public : un artefact se télécharge par n'importe quel compte GitHub.
      # Jusqu'à la 1.2.3 les copies de la base y étaient publiées en clair (audit du 11/11/2026).
      # Elles sont désormais chiffrées (AES-256, phrase secrète BACKUP_PASSPHRASE créée par
      # l'administrateur) ; sans ce secret, rien n'est publié.
      - name: Chiffrer les sauvegardes
        if: always()
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          shopt -s nullglob
          files=(backups/*.dump)
          if [ "${#files[@]}" -eq 0 ]; then exit 0; fi
          if [ -z "${BACKUP_PASSPHRASE}" ]; then
            echo "::warning::Secret BACKUP_PASSPHRASE absent : sauvegardes non publiées (dépôt public)."
            rm -f backups/*.dump
            exit 0
          fi
          for f in "${files[@]}"; do
            gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 0 \
              --symmetric --cipher-algo AES256 --output "${f}.gpg" "${f}" <<< "${BACKUP_PASSPHRASE}"
            rm -f "${f}"
          done
      - name: Sauvegardes chiffrées (artefact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: amm-db-${{ github.run_number }}
          path: backups/*.dump.gpg
          if-no-files-found: ignore
          retention-days: 30
