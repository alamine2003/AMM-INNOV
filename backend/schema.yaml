          description: ''
    delete:
      operationId: v1_alert_rules_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) règle d'alerte.
        required: true
