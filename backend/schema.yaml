      - PLANIFIE
      - EN_PREPARATION
      - DEPOSE
      - EN_INSTRUCTION
      - OBTENU
      - REJETE
      - ABANDONNE
      type: string
      description: |-
        * `PLANIFIE` - Planifié
        * `EN_PREPARATION` - En préparation
        * `DEPOSE` - Déposé
        * `EN_INSTRUCTION` - En instruction
        * `OBTENU` - Obtenu
        * `REJETE` - Rejeté
        * `ABANDONNE` - Abandonné
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
