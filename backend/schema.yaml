      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/alerts/:
    get:
      operationId: v1_alerts_list
      description: |-
        Filters the queryset on `user.countries` for COUNTRY_REGULATORY users.

        `country_lookup` is the ORM path to the country FK (e.g. "country", "amm__country").
      parameters:
      - in: query
        name: amm
        schema:
          type: string
          format: uuid
      - in: query
        name: assigned_to
        schema:
          type: string
      - in: query
        name: code
        schema:
          type: string
      - in: query
        name: country
        schema:
          type: string
      - in: query
        name: due_before
        schema:
          type: string
          format: date
      - name: ordering
        required: false
        in: query
        description: Quel champ utiliser pour classer les résultats.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un terme de recherche.
        schema:
          type: string
      - in: query
        name: severity
        schema:
          type: array
          items:
            type: string
            title: Sévérité
            enum:
            - CRITICAL
            - INFO
            - WARNING
        description: Les valeurs multiples doivent être séparées par des virgules.
        explode: false
        style: form
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
            title: Statut
            enum:
            - ACKNOWLEDGED
            - OPEN
            - RESOLVED
        description: Les valeurs multiples doivent être séparées par des virgules.
        explode: false
        style: form
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlertList'
          description: ''
