openapi: 3.0.3
info:
  title: AMM INNOV API
  version: 1.0.0
  description: Suivi des Autorisations de Mise sur le Marché en Afrique.
paths:
  /api/v1/alert-rules/:
    get:
      operationId: v1_alert_rules_list
      parameters:
      - in: query
        name: code
        schema:
          type: string
      - in: query
        name: country
        schema:
          type: string
          format: uuid
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Quel champ utiliser pour classer les résultats.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un terme de recherche.
        schema:
          type: string
      - in: query
        name: severity
        schema:
          type: string
          title: Sévérité
          enum:
          - CRITICAL
          - INFO
          - WARNING
        description: |-
          * `INFO` - Information
          * `WARNING` - Avertissement
          * `CRITICAL` - Critique
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlertRuleList'
          description: ''
    post:
      operationId: v1_alert_rules_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AlertRuleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AlertRuleRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
          description: ''
  /api/v1/alert-rules/{id}/:
    get:
      operationId: v1_alert_rules_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Un(une) Chaîne UUID identifiant ce(cette) règle d'alerte.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
