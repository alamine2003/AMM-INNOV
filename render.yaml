# ---------------------------------------------------------------------------
# Blueprint Render (https://render.com/docs/blueprint-spec) — AMM INNOV
#
#   backend  : service web Docker (Daphne : API REST + WebSocket), migrations au démarrage
#   worker   : Celery worker avec beat intégré (-B) — 1 seule instance, sinon doublons de jobs
#   redis    : Key Value (broker Celery + channel layer), sans éviction
#   db       : PostgreSQL 16
#
# Le frontend est hébergé sur Netlify (netlify.toml). Les scans PDF vont sur un stockage
# S3 compatible (Cloudflare R2, Backblaze B2, AWS S3…) : Render n'a pas de disque partagé
# entre le service web et le worker. Guide : docs/deploiement-netlify-render.md
# ---------------------------------------------------------------------------

envVarGroups:
  - name: amm-innov-shared
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        sync: false            # 50+ caractères aléatoires : python -c "import secrets; print(secrets.token_urlsafe(64))"
      - key: ALLOWED_HOSTS
        value: amm-innov-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://amm-innov.netlify.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://amm-innov-backend.onrender.com
      - key: FRONTEND_URL
        value: https://amm-innov.netlify.app
      - key: AUTH_REFRESH_COOKIE_DOMAIN
        sync: false            # .amm-innov.com quand app. et api. partagent le domaine ; vide sinon
      - key: AUTH_REFRESH_COOKIE_SAMESITE
        value: "None"          # frontend Netlify et API Render sur deux domaines : cookie tiers (bloqué par Safari).
                               # Passer à Lax avec AUTH_REFRESH_COOKIE_DOMAIN dès que app./api. partagent un domaine.
      - key: TIME_ZONE
        value: Africa/Dakar
      - key: EMAIL_URL
        sync: false            # smtp+tls://utilisateur:motdepasse@smtp.fournisseur.tld:587
      - key: DEFAULT_FROM_EMAIL
        value: AMM INNOV <no-reply@amm-innov.com>
      - key: DOCUMENT_STORAGE
        value: s3
      - key: S3_ENDPOINT_URL
        sync: false            # ex. https://<account>.r2.cloudflarestorage.com
      - key: S3_BUCKET
        value: amm-documents
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: DOCUMENT_MAX_MB
        value: "25"
      - key: ALERTS_DISPATCH_MAX_AGE_DAYS
        value: "30"
      - key: GRAFANA_DB_PASSWORD
        sync: false            # mot de passe du rôle lecture seule grafana_ro (Grafana Cloud)
      - key: METRICS_TOKEN
        sync: false            # jeton du scrape Prometheus (Grafana Cloud) sur /metrics
      - key: NUM_PROXIES
        value: "1"             # Render est le seul proxy : throttle de connexion par vraie IP
      - key: WAIT_TIMEOUT
        value: "60"

services:
  - type: web
    name: amm-innov-backend
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./docker/backend.Dockerfile
    dockerContext: .
    dockerCommand: serve
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass     # déploie seulement quand la CI GitHub est verte
    envVars:
      - fromGroup: amm-innov-shared
      - key: PORT
        value: "8000"
      - key: WEB_CONCURRENCY
        value: "1"             # starter = 512 Mo de RAM : un processus. Passer à 2 dès le plan standard (2 Go).
      - key: RUN_MIGRATIONS
        value: "1"
      - key: COLLECT_STATIC
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: amm-innov-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: amm-innov-redis
          property: connectionString

  - type: worker
    name: amm-innov-worker
    runtime: docker
    region: frankfurt
    plan: starter
    numInstances: 1
    dockerfilePath: ./docker/backend.Dockerfile
    dockerContext: .
    dockerCommand: celery -A config worker -l info --concurrency 2 -B --scheduler django_celery_beat.schedulers:DatabaseScheduler
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: amm-innov-shared
      - key: RUN_MIGRATIONS
        value: "0"
      - key: COLLECT_STATIC
        value: "0"
      - key: CELERY_CONCURRENCY
        value: "2"
      - key: DB_POOL_MAX_SIZE
        value: "4"             # 2 processus Celery × 4 connexions max
      - key: DATABASE_URL
        fromDatabase:
          name: amm-innov-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: amm-innov-redis
          property: connectionString

  - type: keyvalue
    name: amm-innov-redis
    region: frankfurt
    plan: free
    maxmemoryPolicy: noeviction       # jamais d'éviction sur un broker Celery
    ipAllowList: []                   # accès interne uniquement

databases:
  - name: amm-innov-db
    region: frankfurt
    plan: basic-256mb                 # `free` possible pour un essai (expire après 30 jours)
    postgresMajorVersion: "16"
    databaseName: amm
    user: amm
