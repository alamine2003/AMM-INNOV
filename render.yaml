# ---------------------------------------------------------------------------
# Render — backend AMM INNOV, offre gratuite (remplace Railway, septembre 2026).
# Guide : docs/deploiement-render.md
#
#  - amm-innov-api   : API + WebSocket + Celery (AMM_ROLE=all), un seul conteneur Docker.
#  - amm-innov-redis : Key Value gratuit (broker Celery, channel layer, cache).
#  - La base Postgres gratuite n'est PAS décrite ici : Render la supprime après 30 jours.
#    Elle est créée, sauvegardée et renouvelée tous les 25 jours par le workflow
#    .github/workflows/render-db.yml (scripts/render_db.sh), qui renseigne DATABASE_URL.
# ---------------------------------------------------------------------------
services:
  - type: web
    name: amm-innov-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./docker/backend.Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL          # posé par scripts/render_db.sh (base renouvelée tous les 25 j)
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: amm-innov-redis
          property: connectionString
      - key: AMM_ROLE              # web + Celery (beat intégré) dans le même conteneur
        value: all
      - key: CELERY_CONCURRENCY
        value: "1"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: DB_POOL_MAX_SIZE
        value: "8"
      - key: NUM_PROXIES
        value: "1"
      # Interface sur Cloudflare Pages ; Netlify gardé en secours (docs/deploiement-cloudflare-pages.md).
      - key: CORS_ALLOWED_ORIGINS
        value: https://amm-gh.pages.dev,https://amm-innov.netlify.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://amm-gh.pages.dev,https://amm-innov.netlify.app
      - key: FRONTEND_URL
        value: https://amm-gh.pages.dev
      - key: AUTH_REFRESH_COOKIE_SAMESITE
        value: None
      - key: TIME_ZONE
        value: Africa/Dakar
      # Disque éphémère sur Render gratuit : les scans vivent dans Cloudflare R2 (S3 compatible).
      # Valeurs saisies dans le tableau de bord Render (sync: false) : la synchronisation du
      # blueprint ne les écrase pas. Voir docs/deploiement-render.md, section 4.
      - key: DOCUMENT_STORAGE        # s3
        sync: false
      - key: S3_ENDPOINT_URL         # https://<account-id>.r2.cloudflarestorage.com
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ADDRESSING_STYLE
        value: path
      - key: DOCUMENT_MAX_MB
        value: "25"
      - key: WAIT_TIMEOUT
        value: "120"
      - key: EMAIL_URL
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  - type: keyvalue
    name: amm-innov-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction   # broker Celery : ne jamais évincer une tâche en file
    ipAllowList: []               # accès interne uniquement
