# Prometheus (profil `monitoring`) : collecte des métriques du backend Django
# exposées sur /metrics (django-prometheus ou équivalent).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: amm-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: backend

  # Si un exporter Celery (ex. danihodovic/celery-exporter) est ajouté :
  # - job_name: celery
  #   static_configs:
  #     - targets: ["celery-exporter:9808"]
