# Configuration nginx de l'image frontend (production).
# - sert la SPA React (fallback vers index.html) ;
# - proxie /api et /ws vers Daphne (backend:8000), avec upgrade WebSocket ;
# - proxie /grafana/ vers Grafana (configuré en sous-chemin) ;
# - sert les médias uploadés (/media) via X-Accel-Redirect si le backend
#   l'utilise, sinon le backend les sert lui-même.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream backend_upstream {
    server backend:8000;
    keepalive 32;
}

upstream grafana_upstream {
    server grafana:3000;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads de scans PDF (25 Mo côté application + marge)
    client_max_body_size 30m;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss image/svg+xml font/woff2;

    # En-têtes de sécurité (CSP fine gérée par le backend / django-csp)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- API REST ----
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # ---- Métriques Prometheus du backend (réseau interne uniquement) ----
    location = /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---- Fichiers statiques Django (admin, DRF, schéma OpenAPI) ----
    location /static/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        expires 7d;
    }

    # ---- Médias (documents servis par le backend après contrôle d'accès) ----
    location /media/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- WebSocket (Django Channels) ----
    location /ws/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- Grafana en sous-chemin (GF_SERVER_SERVE_FROM_SUB_PATH=true) ----
    location /grafana/ {
        proxy_pass http://grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Grafana Live (WebSocket)
    location /grafana/api/live/ {
        proxy_pass http://grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }

    # ---- Assets Vite : empreinte dans le nom → cache long ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---- SPA : toute autre route retombe sur index.html (jamais mis en cache) ----
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
