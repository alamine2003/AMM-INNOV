# Configuration nginx de l'image frontend (production).
# - sert la SPA React (fallback vers index.html) ;
# - proxie /api et /ws vers Daphne (backend:8000), avec upgrade WebSocket ;
# - proxie /grafana/ vers Grafana (configuré en sous-chemin) ;
# - sert les scans du stockage S3 à la place du backend, qui n'en vérifie plus que le droit de
#   lecture (@stockage, X-Accel-Redirect).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Protocole vu par le visiteur. Le relais placé devant (Caddy) termine TLS et parle HTTP ici :
# `$scheme` vaut donc toujours « http », et Django se croyait en clair (liens `next` de l'API
# en http://, cookies). On transmet ce que dit le relais ; sans relais, le protocole reçu.
# nginx n'est jamais exposé directement : seul le relais peut poser cet en-tête.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Résolution DNS dynamique (nginx >= 1.27.3, DNS embarqué de Docker). Sans elle, nginx
# résolvait les noms au démarrage seulement : Grafana absent à ce moment-là = nginx refusait de
# démarrer et l'API entière devenait injoignable (campagne de chaos s11c) ; backend recréé avec
# une nouvelle IP (déploiement) = nginx visait l'ancienne.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream backend_upstream {
    zone backend_upstream 64k;
    server backend:8000 resolve;
    keepalive 32;
}

upstream grafana_upstream {
    zone grafana_upstream 64k;
    server grafana:3000 resolve;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Dossiers : 250 Mo côté application, plus marge multipart.
    client_max_body_size 260m;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss image/svg+xml font/woff2;

    # En-têtes de sécurité (CSP fine gérée par le backend / django-csp)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- API REST ----
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # ---- Scans servis par nginx (1.3.5) ----
    # L'API a vérifié le droit de lecture et répond sans corps, avec `X-Accel-Redirect` vers cet
    # emplacement et l'adresse signée du fichier dans `X-Storage-Url` (deux minutes de validité).
    # nginx va chercher le fichier dans le stockage S3 et l'envoie : il ne passe plus par Python.
    # Emplacement nommé : aucune requête venue de l'extérieur ne peut l'atteindre, et l'adresse
    # signée n'est jamais transmise au navigateur. nginx garde de la réponse de l'API le type, le
    # nom du fichier et la durée de cache ; les autres en-têtes sont repris ci-dessous.
    location @stockage {
        set $storage_url $upstream_http_x_storage_url;
        set $cors_origin $upstream_http_access_control_allow_origin;
        set $cors_credentials $upstream_http_access_control_allow_credentials;
        set $cors_expose $upstream_http_access_control_expose_headers;
        set $file_csp $upstream_http_content_security_policy;

        proxy_pass $storage_url;
        # L'adresse est signée pour une lecture (GET), quelle que soit la méthode reçue.
        proxy_method GET;
        proxy_http_version 1.1;
        # Stockage en HTTPS : certificat vérifié, pour le nom demandé.
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Connection "";
        # Le stockage refuse une requête signée qui porte aussi le jeton de l'utilisateur.
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        # Le fichier est lu au rythme du navigateur, sans copie sur le disque du conteneur.
        proxy_buffering off;

        # En-têtes du stockage qui ne regardent pas le navigateur, ou que l'API a déjà fixés.
        proxy_hide_header Content-Type;
        proxy_hide_header Content-Disposition;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Vary;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amzn-requestid;
        proxy_hide_header x-amz-content-sha256;
        proxy_hide_header cf-ray;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-version-id;
        proxy_hide_header x-amz-checksum-crc32;
        proxy_hide_header x-amz-server-side-encryption;

        # Un en-tête à valeur vide n'est pas envoyé (origine non autorisée, pas de CSP).
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials $cors_credentials always;
        add_header Access-Control-Expose-Headers $cors_expose always;
        add_header Vary Origin always;
        add_header Content-Security-Policy $file_csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # Fichier disparu ou stockage en panne entre le contrôle de l'API et la lecture : même
        # réponse que l'API, jamais la page d'erreur du stockage.
        proxy_intercept_errors on;
        error_page 400 403 404 500 502 503 504 =503 @stockage_indisponible;
    }

    location @stockage_indisponible {
        default_type application/json;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials $cors_credentials always;
        add_header Vary Origin always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        return 503 '{"detail":"Le stockage des scans est momentanément indisponible. Réessayez plus tard."}';
    }

    # ---- Métriques Prometheus du backend (réseau interne uniquement) ----
    location = /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://backend_upstream;
        proxy_set_header Host $http_host;
        access_log off;
    }

    # ---- Fichiers statiques Django (admin, DRF, schéma OpenAPI) ----
    location /static/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $http_host;
        expires 7d;
    }

    # ---- Médias (documents servis par le backend après contrôle d'accès) ----
    location /media/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # ---- WebSocket (Django Channels) ----
    location /ws/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- Grafana en sous-chemin (GF_SERVER_SERVE_FROM_SUB_PATH=true) ----
    location /grafana/ {
        proxy_pass http://grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Grafana Live (WebSocket)
    location /grafana/api/live/ {
        proxy_pass http://grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
    }

    # ---- Assets Vite : empreinte dans le nom → cache long ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---- SPA : toute autre route retombe sur index.html (jamais mis en cache) ----
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
